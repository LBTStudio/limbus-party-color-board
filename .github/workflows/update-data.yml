name: Update persona data

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-persona-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: LBTStudio/LIMBUS_BUILD_TERMINAL
          path: .lbt
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Rebuild persona data
        run: node tools/build-data.mjs --db .lbt/data/db.json

      - name: Test
        run: npm test

      - name: Commit changes
        run: |
          if git diff --quiet -- data/personas.json; then
            echo "No persona data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/personas.json
          git commit -m "chore: update persona data from LBT"
          git push
