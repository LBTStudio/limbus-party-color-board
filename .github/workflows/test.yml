name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check js/app.mjs
          node --check js/shared-sessions.mjs
          node --check js/shared-sessions-ui.mjs
          node --check js/supabase-config.mjs
          node --check tools/build-supabase-seed.mjs

      - name: Verify generated Supabase persona allowlist
        run: |
          npm run build:supabase-seed
          git diff --exit-code -- supabase/seed-persona-keys.sql

      - name: Run unit tests
        run: npm test
